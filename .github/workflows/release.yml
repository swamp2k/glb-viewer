name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            script: build:win
            artifacts: dist/*.exe
          - platform: linux
            os: ubuntu-22.04
            script: build:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install AppImage build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes fuse libfuse2

      - name: Package application
        run: npm run ${{ matrix.script }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-packages
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read app version
        id: app
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.app.outputs.version }}+build.${{ github.run_number }}
          name: GLB Viewer ${{ steps.app.outputs.version }} (build ${{ github.run_number }})
          generate_release_notes: true
          make_latest: true
          files: dist/*
